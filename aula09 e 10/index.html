<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <section class="conteiner-topo">
            <div class="conteiner-nome-personagem">
                <p>Nome do Personagem</p>
                <input type="text">
            </div>
            <div class="conteiner-nome-jogador">
                <p>Nome Jogador</p>
                <input type="text">
            </div>
            <div class="conteiner-pontos-xp">
                <p>Pontos de Experiência</p>
                <input type="text">
            </div> 
            <div class="conteiner-raca">
                <p>Raça</p>
                <input type="text">
            </div>
            <div class="conteiner-classe">
                <p>Classe</p>
                <input type="text">
            </div>
            <div class="conteiner-alinhamento">
                <p>Alinhamento</p>
                <input type="text">
            </div>          
        </section>
    </header>
    <main class="conteiner-conteudo-principal">
        <section class="sessao-conteudo-principal">
            <div class="conteiner-modificadores">
                <div class="forca">
                    <p>FOR</p>
                    <input type="text">
                </div>
                <div class="destreza">
                    <p>DES</p>
                    <input type="text">
                </div>
                <div class="constituicao">
                    <p>CON</p>
                    <input type="text">
                </div>
                <div class="inteligencia">
                    <p>INT</p>
                    <input type="text">
                </div>
                <div class="sabedoria">
                    <p>SAB</p>
                    <input type="text">
                </div>
                <div class="carisma">
                    <p>CAR</p>
                    <input type="text">
                </div>
            </div>
        </section>
        <section>
            <div class="conteiner-vdv-img">
                <div class="conteiner-vdv">
                    <div>
                        <p>Vida</p>
                        <input type="text">
                    </div>
                    <div>
                        <p>Defesa</p>
                        <input type="text">
                    </div>
                    <div>
                        <p>Velocidade</p>
                        <input type="text">
                    </div>
                </div>
                <div class="conteiner-img">
                    <img src="https://www.reddit.com/r/Marvel/comments/1gpqc7p/who_here_loves_jeff_the_shark_because_i_do_he_is/?tl=pt-br" alt="">
                </div>
                <div class="conteiner-biografia">
                    <h2>Biografia</h2>
                    <textarea cols="30" rows="25"></textarea>
                </div>
            </div>
        </section>
    </main>
    <footer class="sessao-conteudo-secundario">
        <div class="conteiner-equipamento">
            <h2>Equipamentos</h2>
            <textarea></textarea>
        </div>
        <div class="conteiner-caracteristicas">
            <h2>Características</h2>
            <textarea></textarea>
        </div>
    </footer>
    <div class="conteiner-rodape">
        <span><u>Prof. Leonardo</u></span>
    </div>
</body>
</html>
